                  scrollBtn.text = if (scrolling) "⏸ سکڕۆڵ ×" + scrollLvl else "⬇ سکڕۆڵی خۆکار"
                  scrollBtn.background = if (scrolling) rr(ACC, 14) else rr(SURF, 14)
