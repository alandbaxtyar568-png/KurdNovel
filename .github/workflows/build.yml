          KNEOF
          mkdir -p $(dirname app/src/main/java/com/kurdish/novelreal/VekolTts.kt)
          cat > app/src/main/java/com/kurdish/novelreal/VekolTts.kt <<'KNEOF'
          package com.kurdish.novelreal

          import ai.onnxruntime.OnnxTensor
          import ai.onnxruntime.OrtEnvironment
          import ai.onnxruntime.OrtSession
          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.FloatBuffer
          import java.nio.LongBuffer

          /** دەنگی کوردیی سۆرانی (Vekol، Piper ONNX) - بێ ئینتەرنێت لەسەر CPU کار دەکات */
          class VekolTts(private val ctx: Context) {
              private val dir = File(ctx.filesDir, "vekol")
              private val modelF = File(dir, "model.onnx")
              private val cfgF = File(dir, "model.onnx.json")
              private val base = "https://huggingface.co/RevgeAI/vekol-tts-ckb-edge/resolve/main/"

              private var env: OrtEnvironment? = null
              private var session: OrtSession? = null
              private var inputNames: Set<String> = emptySet()
              private val idMap = HashMap<String, IntArray>()
              private var sampleRate = 22050
              private var noise = 0.667f
              private var lengthS = 1.0f
              private var noiseW = 0.8f
              private var charMode = false

              @Volatile
              private var track: AudioTrack? = null

              fun isReady(): Boolean = modelF.exists() && modelF.length() > 1000000L && cfgF.exists()

              fun download(onProgress: (Int) -> Unit) {
                  dir.mkdirs()
                  fetch(base + "model.onnx.json", cfgF, null)
                  fetch(base + "model.onnx", modelF, onProgress)
              }

              private fun fetch(url: String, out: File, onProgress: ((Int) -> Unit)?) {
                  val tmp = File(out.path + ".part")
                  var c: HttpURLConnection? = null
                  try {
                      c = URL(url).openConnection() as HttpURLConnection
                      c.connectTimeout = 15000
                      c.readTimeout = 30000
                      c.instanceFollowRedirects = true
                      c.setRequestProperty("User-Agent", "Mozilla/5.0")
                      if (c.responseCode != 200) throw RuntimeException("HTTP " + c.responseCode)
                      val total = c.contentLengthLong
                      c.inputStream.use { inp ->
                          tmp.outputStream().use { o ->
                              val buf = ByteArray(65536)
                              var done = 0L
                              var last = -1
                              while (true) {
                                  val n = inp.read(buf)
                                  if (n < 0) break
                                  o.write(buf, 0, n)
                                  done += n
                                  if (onProgress != null && total > 0) {
                                      val p = (done * 100 / total).toInt()
                                      if (p != last) {
                                          last = p
                                          onProgress(p)
                                      }
                                  }
                              }
                          }
                      }
                      if (out.exists()) out.delete()
                      if (!tmp.renameTo(out)) throw RuntimeException("rename failed")
                  } finally {
                      c?.disconnect()
                      if (tmp.exists()) tmp.delete()
                  }
              }

              @Synchronized
              fun load() {
                  if (session != null) return
                  try {
                      val cfg = JSONObject(cfgF.readText())
                      val au = cfg.optJSONObject("audio")
                      sampleRate = au?.optInt("sample_rate", 22050) ?: 22050
                      val inf = cfg.optJSONObject("inference")
                      if (inf != null) {
                          noise = inf.optDouble("noise_scale", 0.667).toFloat()
                          lengthS = inf.optDouble("length_scale", 1.0).toFloat()
                          noiseW = inf.optDouble("noise_w", 0.8).toFloat()
                      }
                      noise = 0.74f
                      noiseW = 0.88f
                      lengthS *= 1.06f
                      val pm = cfg.getJSONObject("phoneme_id_map")
                      idMap.clear()
                      val keysIt = pm.keys()
                      while (keysIt.hasNext()) {
                          val k = keysIt.next()
                          val a = pm.getJSONArray(k)
                          val arr = IntArray(a.length())
                          for (j in 0 until a.length()) arr[j] = a.getInt(j)
                          idMap[k] = arr
                      }
                      charMode = cfg.optString("phoneme_type", "") == "text" ||
                          idMap.containsKey("ک") || idMap.containsKey("ب") || idMap.containsKey("ا")
                      val e = OrtEnvironment.getEnvironment()
                      val s = e.createSession(modelF.absolutePath, OrtSession.SessionOptions())
                      env = e
                      session = s
                      inputNames = s.inputNames
                  } catch (ex: Throwable) {
                      session = null
                      try { modelF.delete() } catch (x: Exception) { }
                      try { cfgF.delete() } catch (x: Exception) { }
                      throw ex
                  }
              }

              fun halt() {
                  val t = track
                  track = null
                  try { t?.pause() } catch (x: Exception) { }
                  try { t?.flush() } catch (x: Exception) { }
                  try { t?.release() } catch (x: Exception) { }
              }

              // ---------- دەقەوە بۆ ژمارەی دەنگ ----------

              private fun norm(s: String): String {
                  var t = s.replace('ي', 'ی').replace('ى', 'ی').replace('ك', 'ک')
                      .replace('ة', 'ە').replace('ؤ', 'ۆ')
                  t = t.replace(Regex("[ً-ٰٟـ]"), "")
                  t = t.replace('؟', '?').replace('،', ',').replace('؛', ';')
                  t = t.replace("...", "…")
                  t = t.replace(Regex("[\"“”«»'‘’]"), "")
                  t = t.replace(Regex("[\\[\\](){}*_~#|/\\\\<>=+^@]"), " ")
                  t = t.replace(Regex("\\s+[-–—]+\\s+"), ", ")
                  t = t.replace('…', '.')
                  t = t.replace(Regex("\\s+"), " ").trim()
                  return t
              }

              private val cons = mapOf(
                  'ب' to "b", 'پ' to "p", 'ت' to "t", 'ج' to "dʒ", 'چ' to "tʃ", 'ح' to "ħ",
                  'خ' to "x", 'د' to "d", 'ر' to "ɾ", 'ڕ' to "r", 'ز' to "z", 'ژ' to "ʒ",
                  'س' to "s", 'ش' to "ʃ", 'ع' to "ʕ", 'غ' to "ɣ", 'ف' to "f", 'ڤ' to "v",
                  'ق' to "q", 'ک' to "k", 'گ' to "ɡ", 'ل' to "l", 'ڵ' to "ɫ", 'م' to "m",
                  'ن' to "n", 'ث' to "s", 'ذ' to "z", 'ص' to "s", 'ض' to "d", 'ط' to "t", 'ظ' to "z"
              )
              private val vow = "اەێۆیو"

              private fun cps(s: String): List<String> {
                  val out = ArrayList<String>()
                  var i = 0
                  while (i < s.length) {
                      val cp = s.codePointAt(i)
                      out.add(String(Character.toChars(cp)))
                      i += Character.charCount(cp)
                  }
                  return out
              }

              private fun charSeq(t: String): List<String> {
                  val out = ArrayList<String>()
                  for (p in cps(t)) {
                      if (idMap.containsKey(p)) out.add(p)
                  }
                  return out
              }

              private fun ipaSeq(t: String): List<String> {
                  val out = ArrayList<String>()
                  fun isL(c: Char) = cons.containsKey(c) || vow.indexOf(c) >= 0 || c == 'ه'
                  val n = t.length
                  var i = 0
                  while (i < n) {
                      val c = t[i]
                      val prevL = i > 0 && isL(t[i - 1])
                      val nextL = i + 1 < n && isL(t[i + 1])
                      val nextV = i + 1 < n && vow.indexOf(t[i + 1]) >= 0
                      if (c == ' ') {
                          if (out.isNotEmpty() && out.last() != " ") out.add(" ")
                      } else if (c == 'و' && i + 1 < n && t[i + 1] == 'و') {
                          out.addAll(cps("uː"))
                          i++
                      } else if (c == 'و') {
                          if (!prevL || nextV) out.add("w") else out.addAll(cps("uː"))
                      } else if (c == 'ی') {
                          if (!prevL || nextV) out.add("j") else out.addAll(cps("iː"))
                      } else if (c == 'ه') {
                          if (nextL) out.add("h") else out.addAll(cps("æ"))
                      } else if (c == 'ا') {
                          out.addAll(cps("aː"))
                      } else if (c == 'ە') {
                          out.addAll(cps("æ"))
                      } else if (c == 'ێ') {
                          out.addAll(cps("eː"))
                      } else if (c == 'ۆ') {
                          out.addAll(cps("oː"))
                      } else if (cons.containsKey(c)) {
                          out.addAll(cps(cons[c]!!))
                      } else if (c == '.' || c == ',' || c == '!' || c == '?' || c == ';' || c == ':') {
                          out.add(c.toString())
                      }
                      i++
                  }
                  return out.filter { idMap.containsKey(it) }
              }

              private fun toIds(text: String): LongArray {
                  val t = norm(text)
                  val ph = if (charMode) charSeq(t) else ipaSeq(t)
                  val out = ArrayList<Long>()
                  val bos = idMap["^"]
                  val eos = idMap["\$"]
                  val pad = idMap["_"]
                  bos?.forEach { out.add(it.toLong()) }
                  for (p in ph) {
                      val m = idMap[p] ?: continue
                      m.forEach { out.add(it.toLong()) }
                      pad?.forEach { out.add(it.toLong()) }
                  }
                  eos?.forEach { out.add(it.toLong()) }
                  return out.toLongArray()
              }

              // ---------- مۆدێل ----------

              private fun collect(o: Any?, acc: ArrayList<FloatArray>) {
                  if (o is FloatArray) {
                      acc.add(o)
                  } else if (o is Array<*>) {
                      for (x in o) collect(x, acc)
                  }
              }

              private fun infer(ids: LongArray, speed: Float, jit: Float): ShortArray {
                  val e = env ?: throw RuntimeException("model not loaded")
                  val s = session ?: throw RuntimeException("model not loaded")
                  val inputs = HashMap<String, OnnxTensor>()
                  try {
                      inputs["input"] = OnnxTensor.createTensor(e, LongBuffer.wrap(ids), longArrayOf(1L, ids.size.toLong()))
                      if (inputNames.contains("input_lengths")) {
                          inputs["input_lengths"] = OnnxTensor.createTensor(
                              e, LongBuffer.wrap(longArrayOf(ids.size.toLong())), longArrayOf(1L)
                          )
                      }
                      if (inputNames.contains("scales")) {
                          val sp = if (speed <= 0f) 1f else speed
                          inputs["scales"] = OnnxTensor.createTensor(
                              e, FloatBuffer.wrap(floatArrayOf(noise, lengthS * jit / sp, noiseW)), longArrayOf(3L)
                          )
                      }
                      if (inputNames.contains("sid")) {
                          inputs["sid"] = OnnxTensor.createTensor(e, LongBuffer.wrap(longArrayOf(0L)), longArrayOf(1L))
                      }
                      val acc = ArrayList<FloatArray>()
                      s.run(inputs).use { res ->
                          collect(res[0].value, acc)
                      }
                      var total = 0
                      for (a in acc) total += a.size
                      val all = FloatArray(total)
                      var off = 0
                      for (a in acc) {
                          System.arraycopy(a, 0, all, off, a.size)
                          off += a.size
                      }
                      var mx = 0.01f
                      for (v in all) {
                          val av = if (v < 0f) -v else v
                          if (av > mx) mx = av
                      }
                      val k = 32767f / mx
                      val pcm = ShortArray(total)
                      for (j in 0 until total) {
                          var v = all[j] * k
                          if (v > 32767f) v = 32767f
                          if (v < -32767f) v = -32767f
                          pcm[j] = v.toInt().toShort()
                      }
                      return pcm
                  } finally {
                      for (v in inputs.values) {
                          try { v.close() } catch (x: Exception) { }
                      }
                  }
              }

              private fun split(text: String): List<String> {
                  val parts = ArrayList<String>()
                  for (s in text.split(Regex("(?<=[.!?؟۔…])\\s+|\\n+"))) {
                      val p = s.trim()
                      if (p.isEmpty()) continue
                      if (p.length <= 220) {
                          parts.add(p)
                      } else {
                          var cur = StringBuilder()
                          for (w in p.split(' ')) {
                              if (cur.isNotEmpty() && cur.length + w.length + 1 > 200) {
                                  parts.add(cur.toString())
                                  cur = StringBuilder()
                              }
                              if (cur.isNotEmpty()) cur.append(' ')
                              cur.append(w)
                          }
                          if (cur.isNotEmpty()) parts.add(cur.toString())
                      }
                  }
                  return parts
              }

              private class Ck(val item: Int, val text: String, val firstOfItem: Boolean, val lastOfItem: Boolean)

              private val exec = java.util.concurrent.Executors.newSingleThreadExecutor()
              private val rnd = java.util.Random()

              private fun fade(p: ShortArray) {
                  val n = minOf(sampleRate / 160, p.size / 2)
                  for (i in 0 until n) {
                      val g = i.toFloat() / n
                      p[i] = (p[i] * g).toInt().toShort()
                      p[p.size - 1 - i] = (p[p.size - 1 - i] * g).toInt().toShort()
                  }
              }

              private fun silence(t: AudioTrack, ms: Int, cancelled: () -> Boolean): Int {
                  val n = sampleRate * ms / 1000
                  val z = ShortArray(minOf(maxOf(n, 1), 4096))
                  var left = n
                  while (left > 0) {
                      if (cancelled()) return -1
                      val k = minOf(left, z.size)
                      val w = t.write(z, 0, k)
                      if (w <= 0) return -1
                      left -= w
                  }
                  return n
              }

              /** هەموو پەرەگرافەکان بە دوای یەکدا دەخوێنێتەوە، لەگەڵ وەستانی سروشتی. onItem بۆ هەڵدانی پەرەگرافە. */
              fun speakAll(items: List<Pair<Int, String>>, speed: Float, onItem: (Int) -> Unit, cancelled: () -> Boolean) {
                  val cks = ArrayList<Ck>()
                  for (it0 in items) {
                      val parts = split(it0.second)
                      for ((k, p) in parts.withIndex()) cks.add(Ck(it0.first, p, k == 0, k == parts.size - 1))
                  }
                  if (cks.isEmpty()) return
                  val futs = arrayOfNulls<java.util.concurrent.Future<ShortArray?>>(cks.size)
                  fun submit(i: Int) {
                      if (i < cks.size && futs[i] == null) {
                          val c = cks[i]
                          val jit = 0.97f + rnd.nextFloat() * 0.08f
                          futs[i] = exec.submit(java.util.concurrent.Callable<ShortArray?> {
                              if (cancelled()) {
                                  null
                              } else {
                                  val ids = toIds(c.text)
                                  if (ids.size < 3) null else infer(ids, speed, jit)
                              }
                          })
                      }
                  }
                  val minBuf = AudioTrack.getMinBufferSize(
                      sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  val t = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setSampleRate(sampleRate)
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build()
                      )
                      .setBufferSizeInBytes(maxOf(minBuf, sampleRate))
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()
                  track = t
                  var frames = 0L
                  try {
                      t.play()
                      submit(0)
                      submit(1)
                      submit(2)
                      for (i in cks.indices) {
                          if (cancelled()) return
                          submit(i + 3)
                          val c = cks[i]
                          val pcm = try {
                              futs[i]!!.get()
                          } catch (e: java.util.concurrent.ExecutionException) {
                              throw (e.cause ?: e)
                          }
                          if (cancelled()) return
                          if (c.firstOfItem) onItem(c.item)
                          if (pcm != null) {
                              fade(pcm)
                              var off = 0
                              while (off < pcm.size) {
                                  if (cancelled()) return
                                  val n = t.write(pcm, off, pcm.size - off)
                                  if (n <= 0) return
                                  off += n
                              }
                              frames += pcm.size
                          }
                          val endCh = c.text.trimEnd().lastOrNull()
                          val sentenceEnd = endCh != null && ".!?؟…".indexOf(endCh) >= 0
                          var ms = if (c.lastOfItem) 650 else if (sentenceEnd) 330 else 140
                          ms = (ms * (0.88f + rnd.nextFloat() * 0.3f)).toInt()
                          val s = silence(t, ms, cancelled)
                          if (s < 0) return
                          frames += s
                      }
                      t.stop()
                      var guard = 0
                      while (!cancelled() && t.playbackHeadPosition < frames && guard < 1200) {
                          Thread.sleep(50)
                          guard++
                      }
                  } finally {
                      for (f in futs) {
                          try { f?.cancel(false) } catch (x: Exception) { }
                      }
                      try { t.release() } catch (x: Exception) { }
                      if (track === t) track = null
                  }
              }
          }
