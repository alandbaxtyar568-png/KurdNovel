              }

              private fun downloadVekol() {
                  val dlg = AlertDialog.Builder(this)
                      .setTitle("دابەزاندنی دەنگی کوردی")
                      .setMessage("0%")
                      .setCancelable(false)
                      .create()
                  dlg.show()
                  Thread {
                      try {
                          vekol.download { p -> ui.post { dlg.setMessage(p.toString() + "%") } }
                          vekol.load()
                          ui.post {
                              dlg.dismiss()
                              toggleRead()
                          }
                      } catch (e: Throwable) {
                          ui.post {
                              dlg.dismiss()
                              toast("دابەزاندن سەرکەوتوو نەبوو: " + (e.message ?: e.javaClass.simpleName))
                          }
                      }
                  }.start()
              }

              private fun playVekol(items: List<Pair<Int, String>>) {
                  val gen = ++vekolGen
                  lastIdx = items.last().first
                  Thread {
                      try {
                          vekol.load()
                          vekol.speakAll(
                              items, speed,
                              { i -> ui.post { web.evaluateJavascript("window.__kmHi(" + i + ");", null) } },
                              { !(reading && gen == vekolGen) }
                          )
                          ui.post { if (reading && gen == vekolGen) startReading(lastIdx + 1) }
                      } catch (e: Throwable) {
                          ui.post {
                              stopReading()
                              toast("هەڵەی دەنگ: " + (e.message ?: e.javaClass.simpleName))
                          }
                      }
                  }.start()
              }
