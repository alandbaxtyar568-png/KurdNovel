              private fun translateNew() {
                  if (busy) {
                      ui.postDelayed(tick, 800)
                      return
                  }
                  busy = true
                  web.evaluateJavascript(JS_INIT, null)
                  web.evaluateJavascript("window.__kmFs=" + fs + ";", null)
                  if (fam.isNotEmpty()) web.evaluateJavascript("window.__kmFamSet('" + fam + "');", null)
                  web.evaluateJavascript(JS_COLLECT) { raw ->
                      val items = ArrayList<Pair<Int, String>>()
                      try {
                          val a = JSONArray(JSONTokener(raw).nextValue() as String)
                          for (i in 0 until a.length()) {
                              val o = a.getJSONObject(i)
                              items.add(Pair(o.getInt("i"), o.getString("t")))
                          }
                      } catch (e: Exception) {
                      }
                      if (items.isEmpty()) {
                          busy = false
                      } else {
                          runBatches(items)
                      }
                  }
              }

              private fun runBatches(items: List<Pair<Int, String>>) {
                  val key = prefs.getString("gk", "") ?: ""
                  val model = prefs.getString("gm", "gemini-flash-latest") ?: "gemini-flash-latest"
                  val batches = items.chunked(12)
                  var left = batches.size
                  stat.text = "⏳ 0/" + batches.size
                  for (b in batches) {
                      Tr.pool.execute {
                          val texts = b.map { it.second }
                          var res: List<String>? = null
                          if (key.isNotBlank()) res = Tr.gemini(key, model, texts)
                          if (res == null) {
                              val fut = texts.map { t -> Tr.gpool.submit(Callable<String> { try { Tr.google(t) } catch (e: Exception) { "" } }) }
                              res = fut.map { try { it.get() } catch (e: Exception) { "" } }
                          }
                          val fin: List<String> = res
                          val arr = JSONArray()
                          for ((i, p) in b.withIndex()) {
                              if (fin[i].isNotBlank()) arr.put(JSONObject().put("i", p.first).put("t", fin[i]))
                          }
                          ui.post {
                              web.evaluateJavascript("window.__kmSet(" + arr.toString() + ");", null)
                              left--
                              stat.text = if (left <= 0) "✓" else "⏳ " + (batches.size - left) + "/" + batches.size
                              if (left <= 0) busy = false
                          }
                      }
                  }
              }

