              private fun initTts() {
                  val t = tts ?: return
                  var loc: Locale? = null
                  for (l in listOf(Locale("ckb"), Locale("ckb", "IQ"), Locale("ku"), Locale("ku", "IQ"))) {
                      val r = try { t.isLanguageAvailable(l) } catch (e: Exception) { TextToSpeech.LANG_NOT_SUPPORTED }
                      if (r >= TextToSpeech.LANG_AVAILABLE) {
                          loc = l
                          break
                      }
                  }
                  ttsLoc = loc
                  t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {
                          val i = id?.substringBefore('_')?.toIntOrNull() ?: return
                          ui.post { web.evaluateJavascript("window.__kmHi(" + i + ");", null) }
                      }

                      override fun onDone(id: String?) {
                          if (id != null && id.endsWith("_last")) ui.post { if (reading) startReading(lastIdx + 1) }
                      }

                      override fun onError(id: String?) {
                          ui.post { stopReading() }
                      }
                  })
              }

              private fun toggleRead() {
                  if (reading) {
                      stopReading()
                      return
                  }
                  useVekol = ttsLoc == null
                  if (useVekol && !vekol.isReady()) {
                      noVoiceDialog()
                      return
                  }
                  if (scrolling) stopScroll()
                  if (!auto) {
                      auto = true
                      styleBtns()
                      translateNew()
                  }
                  reading = true
                  emptyRetries = 0
                  styleBtns()
                  startReading(-1)
              }

              private fun stopReading() {
                  reading = false
                  vekolGen++
                  try { if (useVekol) vekol.halt() } catch (e: Exception) { }
                  tts?.stop()
                  styleBtns()
                  web.evaluateJavascript("window.__kmHi(-1);", null)
              }

              private fun startReading(from: Int) {
                  web.evaluateJavascript(JS_INIT, null)
                  web.evaluateJavascript("window.__kmList(" + from + ");") { raw ->
                      if (reading) {
                          val items = ArrayList<Pair<Int, String>>()
                          try {
                              val a = JSONArray(JSONTokener(raw).nextValue() as String)
                              for (i in 0 until a.length()) {
                                  val o = a.getJSONObject(i)
                                  items.add(Pair(o.getInt("i"), o.getString("t")))
                              }
                          } catch (e: Exception) {
                          }
                          if (items.isEmpty()) {
                              if (busy) {
                                  ui.postDelayed({ if (reading) startReading(from) }, 1500)
                              } else if (from >= 0) {
                                  if (emptyRetries < 2) {
                                      emptyRetries++
                                      web.evaluateJavascript("window.scrollBy(0,window.innerHeight*0.9);", null)
                                      ui.postDelayed({ if (reading) startReading(from) }, 2000)
                                  } else {
                                      emptyRetries = 0
                                      goNextChapter()
                                  }
                              } else if (emptyRetries < 20) {
                                  emptyRetries++
                                  ui.postDelayed({ if (reading) startReading(from) }, 2000)
                              } else {
                                  stopReading()
                                  toast("هیچ دەقێکی وەرگێڕدراو نییە. سەرەتا وەرگێڕان چالاک بکە.")
                              }
                          } else {
                              emptyRetries = 0
                              if (useVekol) {
                                  playVekol(items)
                                  return@evaluateJavascript
                              }
                              val t = tts
                              val loc = ttsLoc
                              if (t != null && loc != null) {
                                  t.language = loc
                                  t.setSpeechRate(speed)
                                  for ((k, p) in items.withIndex()) {
                                      val id = if (k == items.size - 1) p.first.toString() + "_last" else p.first.toString()
                                      t.speak(p.second.take(3900), TextToSpeech.QUEUE_ADD, null, id)
                                  }
                                  lastIdx = items.last().first
                              }
                          }
                      }
                  }
              }

              private fun goNextChapter() {
                  if (contNav) return
                  web.evaluateJavascript(JS_INIT, null)
                  web.evaluateJavascript("window.__kmNext();") { raw ->
                      val u = try { (JSONTokener(raw).nextValue() as? String) ?: "" } catch (e: Exception) { "" }
                      if (u.isBlank()) {
                          if (reading) stopReading()
                          if (scrolling) stopScroll()
                          toast("بەشی دواتر نەدۆزرایەوە. خۆت دوگمەی Next دابگرە.")
                      } else {
                          contNav = true
                          stat.text = "➡ بەشی دواتر..."
                          ui.postDelayed({ contNav = false }, 60000)
                          web.loadUrl(u)
                      }
                  }
              }

              private fun cycleScroll() {
                  if (reading) stopReading()
                  scrollLvl = (scrollLvl + 1) % (scrollLevels.size + 1)
                  ui.removeCallbacks(scrollTick)
                  scrolling = scrollLvl > 0
                  bottomTicks = 0
                  if (scrolling) ui.post(scrollTick)
