              private fun noVoiceDialog() {
                  AlertDialog.Builder(this)
                      .setTitle("دەنگی کوردی")
                      .setMessage("مۆبایلەکەت دەنگی کوردیی سۆرانی نییە. دەتوانیت دەنگی Vekol دابەزێنیت (نزیکەی ٧٧ مێگابایت، تەنها یەک جار، ئینتەرنێت پێویستە). دوای ئەوە بە کوردیی ڕاستەقینە دەخوێنێتەوە و ئینتەرنێت پێویست نییە.")
                      .setPositiveButton("دابەزاندن") { _, _ -> downloadVekol() }
                      .setNeutralButton("دەنگی عەرەبی") { _, _ -> useArabic() }
                      .setNegativeButton("داخستن", null)
